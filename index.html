<!DOCTYPE html>
<html lang="en">
<head>

<style>

:root[data-theme="dark"]{--bg:#151816;--card:#1e2220;--tx:#eceee9;--mut:#9aa39c;--bd:#2f3532;--ac:#4fb68a;--acx:#0d1a14;--neg:#e47b69}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
.w{max-width:640px;margin:0 auto;padding:14px 14px 28px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:4px 0 8px}
h1{font-size:21px;margin:0;letter-spacing:-.2px}
#sy{font-size:12px;color:var(--mut);text-align:right;max-width:50%;line-height:1.25}
h2{font-size:15px;font-weight:700;margin:20px 2px 8px}
nav{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:6px 0;margin:0 0 8px;background:var(--bg)}
nav button{min-height:36px;padding:6px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:13px;font-weight:600;line-height:1.15}
nav button:last-child:nth-child(4n+3){grid-column:span 2}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.card p{margin:12px 0 0}.card p:first-child{margin-top:0}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;align-items:end}.g>*{min-width:0}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:0 0 5px;line-height:1.25}
.card>label{margin-top:12px}.card>label:first-child{margin-top:0}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
textarea{min-height:0}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=file]{min-height:0;padding:9px}
input[type=checkbox]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.f{grid-column:1/-1}
.b{min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--ac);background:var(--ac);color:var(--acx);font-size:15px;font-weight:600;line-height:1.15}
.b.s{background:none;color:var(--ac)}.b.x{border-color:var(--neg);color:var(--neg);background:none}
.card p:has(>.b){display:flex;gap:8px;flex-wrap:wrap}.card p:has(>.b)>.b{flex:1 1 0;padding:10px 6px}.card p+.mut{margin-top:10px}.lr{display:flex;justify-content:space-between;align-items:center;gap:6px}.lk{border:0;background:none;color:var(--ac);font-size:12px;font-weight:700;padding:0;min-height:0}
.it>p:has(>.b){display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
.it>p>.b{min-height:40px;padding:8px 4px;font-size:13px}

.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row:has(>div>.b){flex-direction:column}
.row>div:has(>.b){display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;width:100%}
.row>div:has(>.b)>.b{min-height:38px;padding:6px 4px;font-size:13px}
.mut{color:var(--mut);font-size:13px}.pos{color:var(--ac)}.neg{color:var(--neg)}
.tag{font-size:11px;padding:3px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mut);white-space:nowrap;align-self:flex-start}
.stat{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}
.stat:last-child{border:0}.big{font-weight:700;font-size:17px}
.ov{overflow-x:auto}.hide{display:none}
.chip{min-height:42px;padding:8px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.cg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.cg>.chip:last-child:nth-child(odd){grid-column:1/-1}
</style>
</head>

<div class="w">

<script>
var KEY="resellerTax1",PLATS=["eBay","Depop","Vinted","Poshmark","Whatnot","Other"],ITYPES=["Clothes","Figurines","Toys","Pictures / art","Home goods","Other"],ACQ=["Bought","Free / gift","Already owned"],

function idbPut(k,v){return idb().then(function(d){return new Promise(function(res){var t=d.transaction("p","readwrite");t.objectStore("p").put(v,k);t.oncomplete=res;t.onerror=res})}).catch(function(){IDBOK=false})}
function idbDel(k){return idb().then(function(d){return new Promise(function(res){var t=d.transaction("p","readwrite");t.objectStore("p").delete(k);t.oncomplete=res;t.onerror=res})}).catch(function(){})}
function sigI(i){return (i.photos||[]).join("").length+"|"+(i.photo||"").length}
function persistPhotos(){var ps=[],live={};
S.items.forEach(function(i){var k="i:"+i.id,has=(i.photos&&i.photos.length)||i.photo;live[k]=1;if(has){var sg=sigI(i);if(PC[k]!==sg){PC[k]=sg;ps.push(idbPut(k,{photos:(i.photos&&i.photos.length)?i.photos:[i.photo],photo:i.photo||i.photos[0]}))}}else if(PC[k]){delete PC[k];ps.push(idbDel(k))}});
(S.rcp||[]).forEach(function(r){var k="r:"+r.id;live[k]=1;if(r.photo){var sg=String(r.photo.length);if(PC[k]!==sg){PC[k]=sg;ps.push(idbPut(k,r.photo))}}else if(PC[k]){delete PC[k];ps.push(idbDel(k))}});

function hydrate(){return idb().then(function(d){return new Promise(function(res){var m={},t=d.transaction("p"),c=t.objectStore("p").openCursor();c.onsuccess=function(){var x=c.result;if(x){m[x.key]=x.value;x.continue()}};t.oncomplete=function(){res(m)};t.onerror=function(){res({})}})}).then(function(m){var ch=false;
S.items.forEach(function(i){var v=m["i:"+i.id];if(v&&!(i.photos&&i.photos.length)&&!i.photo){i.photos=v.photos;i.photo=v.photo;ch=true}if(v)PC["i:"+i.id]=sigI(i)});
(S.rcp||[]).forEach(function(r){var v=m["r:"+r.id];if(v&&!r.photo){r.photo=v;ch=true}if(v)PC["r:"+r.id]=String((r.photo||"").length)});return ch}).catch(function(){IDBOK=false;return false})}

DBZ=true;say2("Photo sync: "+DQ.length+" left\u2026");var j=DQ.shift();j().catch(function(){}).then(function(){DBZ=false;if(!DQ.length)say2("Photos synced");dRun()})}
function syncPhotos(){var ch=false;
S.items.forEach(function(i){var k="i:"+i.id,has=(i.photos&&i.photos.length)||i.photo;

if(C.url&&READY&&(UP[k]===undefined||DIRTY[k])){var val=JSON.stringify({photos:(i.photos&&i.photos.length)?i.photos:[i.photo]});UP[k]=String(i.pv);delete DIRTY[k];upSave();
dq(function(){return api({action:"photo_put",key:k,data:val}).then(function(r){if(!r.ok){delete UP[k];upSave()}},function(){delete UP[k];upSave()})})}}
else{if(i.hp===1){i.hp=0;ch=true}if(UP[k]&&C.url&&READY){delete UP[k];upSave();dq(function(){return api({action:"photo_del",key:k})})}}});
(S.rcp||[]).forEach(function(r){var k="r:"+r.id;
if(r.photo){if(r.hp!==1){r.hp=1;ch=true}if(!r.pv){r.pv=Date.now();ch=true}
if(C.url&&READY&&(UP[k]===undefined||DIRTY[k])){var val=JSON.stringify({photo:r.photo});UP[k]=String(r.pv);delete DIRTY[k];upSave();
dq(function(){return api({action:"photo_put",key:k,data:val}).then(function(x){if(!x.ok){delete UP[k];upSave()}},function(){delete UP[k];upSave()})})}}
else{if(r.hp===1){r.hp=0;ch=true}if(UP[k]&&C.url&&READY){delete UP[k];upSave();dq(function(){return api({action:"photo_del",key:k})})}}});
return ch}
function fetchPhotos(){if(!C.url||!READY)return;var need=[];
S.items.forEach(function(i){var k="i:"+i.id,has=(i.photos&&i.photos.length)||i.photo;if(i.hp&&i.pv&&(!has||(UP[k]!==undefined&&UP[k]!==String(i.pv))))need.push(k)});
(S.rcp||[]).forEach(function(r){var k="r:"+r.id;if(r.hp&&r.pv&&(!r.photo||(UP[k]!==undefined&&UP[k]!==String(r.pv))))need.push(k)});
for(var x=0;x<need.length;x+=6){(function(b){dq(function(){return api({action:"photo_get",keys:b}).then(function(r){if(!r.ok)return;var any=false;
b.forEach(function(k){var d=r.items&&r.items[k],o;if(!d)return;try{o=JSON.parse(d)}catch(e){return}
if(k.charAt(0)==="i"){S.items.forEach(function(i){if("i:"+i.id===k){i.photos=o.photos;i.photo=o.photos[0];UP[k]=String(i.pv);any=true}})}
else{(S.rcp||[]).forEach(function(rc){if("r:"+rc.id===k){rc.photo=o.photo;UP[k]=String(rc.pv);any=true}})}});
if(any){upSave();FR=true;persistPhotos()}})})})(need.slice(x,x+6))}dRun()}
function push(){if(!C.url||!READY)return;say2("Saving…");clearTimeout(pt);pt=setTimeout(function(){api({action:"save",state:JSON.parse(JSON.stringify(S,pr))}).then(function(r){say2(r.ok?"Saved to Google Sheet "+new Date().toLocaleTimeString():"Not saved: "+(r.error||"error"))}).catch(function(){say2("Offline. Will save on your next change")})},1200)}
function pull(){if(!C.url){READY=true;return}say2("Loading…");api({action:"load"}).then(function(r){if(!r.ok){READY=true;say2("Sheet error: "+(r.error||""));return}var d=r.state;
if(d&&(d._t||0)>(S._t||0)){S=Object.assign({items:[],exp:[],miles:[],rate:0.70},d);return persistPhotos().then(function(){try{localStorage.setItem(KEY,JSON.stringify(S,pr))}catch(e){}return hydrate()}).then(function(){READY=true;render();say2("Loaded from Google Sheet");if(syncPhotos())save();fetchPhotos();dRun()})}
READY=true;say2("Synced");if(!d||(S._t||0)>(d._t||0))push();if(syncPhotos())save();fetchPhotos();dRun()}).catch(function(){READY=true;say2("Offline. Using this device’s copy")})}
function conn(){C={url:$("c_u").value.trim(),token:$("c_t").value};try{localStorage.setItem(CK,JSON.stringify(C))}catch(e){}pull()}
function save(){S._t=Date.now();persistPhotos();syncPhotos();try{localStorage.setItem(KEY,JSON.stringify(S,pr))}catch(e){alert("This browser’s saved-data limit was reached. Copy a Backup now and tell Claude.")}push()}
function $(i){return document.getElementById(i)}
window.alert=function(t){var b=$("tb");if(!b){b=document.createElement("div");b.id="tb";b.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:10px;z-index:9;font-size:14px";document.body.appendChild(b)}b.textContent=t;b.style.display="block";clearTimeout(b._t);b._t=setTimeout(function(){b.style.display="none"},4000)};

var h='<div class="card"><b>Bulk haul cost helper</b><div class="g">'+

(e.sd?'<div><label>Date sold</label><input type="date" id="a_sd" value="'+esc(e.sd)+'"></div>'+

var L=S.items.slice().sort(function(a,b){return (b.bd||"")>(a.bd||"")?1:-1});
setFK();h+='<h2>'+L.length+' items</h2>';
